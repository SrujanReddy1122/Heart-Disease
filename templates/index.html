<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heart Disease Risk Classifier</title>
<style>
  /* ---------- COLORS ---------- */
  :root{
    --bg:#fff7fb; --ink:#2a1f3d; --mute:#6f6585; --card:#ffffff;
    --pink:#ff3d81; --purple:#7c3aed; --blue:#2563eb; --teal:#0ea5a4;
    --orange:#ff8a1f; --green:#16a34a; --red:#e11d48; --yellow:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}

  /* ---------- HEADER ---------- */
  header{background:linear-gradient(120deg,var(--purple),var(--pink) 55%,var(--orange));color:#fff;padding:44px 20px 70px;text-align:center}
  header h1{margin:0 0 8px;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:-.5px}
  header p{margin:0 auto;max-width:560px;opacity:.95}
  .heart{display:inline-block;animation:beat 1.2s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
  @media (prefers-reduced-motion:reduce){.heart{animation:none}}

  main{max-width:900px;margin:-44px auto 60px;padding:0 16px}

  /* ---------- SECTIONS ---------- */
  .section{background:var(--card);border-radius:16px;padding:20px 20px 8px;margin-bottom:20px;
           box-shadow:0 8px 24px rgba(124,58,237,.12);border-top:6px solid var(--c)}
  .section h2{margin:0 0 14px;font-size:1.15rem;color:var(--c)}
  .s1{--c:var(--blue)} .s2{--c:var(--teal)} .s3{--c:var(--orange)} .s4{--c:var(--purple)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px 18px;margin-bottom:12px}

  label.t{display:block;font-weight:700;font-size:.92rem;margin-bottom:5px}
  label.t small{font-weight:400;color:var(--mute)}
  input[type=number]{width:100%;padding:10px 12px;font:inherit;border:2px solid #e6def5;border-radius:10px;background:#fcfaff}
  input[type=number]:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
  [aria-invalid=true]{border-color:var(--red)!important}

  /* ---------- PILL BUTTONS ---------- */
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pills label{cursor:pointer}
  .pills input{position:absolute;opacity:0;pointer-events:none}
  .pills span{display:inline-block;padding:8px 16px;border-radius:999px;border:2px solid #e6def5;background:#fcfaff;font-weight:600;font-size:.9rem;transition:.15s}
  .pills input:checked+span{color:#fff;background:var(--p,var(--c));border-color:var(--p,var(--c))}
  .pills input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}
  .pills.group-invalid span{border-color:var(--red)}
  .Low{--p:var(--green)} .Medium{--p:var(--orange)} .High{--p:var(--red)}
  .Yes{--p:var(--pink)} .No{--p:var(--teal)} .Male{--p:var(--blue)} .Female{--p:var(--purple)}

  /* ---------- BUTTONS ---------- */
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
  button{font:700 1rem inherit;font-family:inherit;padding:13px 28px;border-radius:12px;border:0;cursor:pointer}
  #go{color:#fff;background:linear-gradient(120deg,var(--purple),var(--pink));box-shadow:0 6px 16px rgba(255,61,129,.35)}
  #go:hover{filter:brightness(1.08)}
  #reset{background:#fff;color:var(--purple);border:2px solid var(--purple)}
  button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  #err{color:var(--red);font-weight:700;margin:0 0 12px}

  /* ---------- RESULT ---------- */
  #out{display:none;border-radius:16px;padding:24px;color:#fff;text-align:center;box-shadow:0 10px 28px rgba(0,0,0,.18)}
  #out.yes{background:linear-gradient(135deg,#e11d48,#ff8a1f)}
  #out.no{background:linear-gradient(135deg,#0ea5a4,#16a34a)}
  #out h2{margin:0 0 14px;font-size:1.6rem}
  .ring{width:150px;height:150px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
        background:conic-gradient(#fff var(--deg),rgba(255,255,255,.3) 0)}
  .ring div{width:116px;height:116px;border-radius:50%;background:rgba(0,0,0,.28);display:grid;place-items:center;font-size:1.7rem;font-weight:800}
  .small{font-size:.85rem;opacity:.95;max-width:560px;margin:10px auto 0}
  .foot{text-align:center;color:var(--mute);font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1><span class="heart">❤️</span> Heart Disease Risk Classifier</h1>
  <p>Fill in all 20 inputs and the model will classify Heart Disease Status as <b>Yes</b> or <b>No</b>.</p>
</header>

<main>
  <form id="form" novalidate>
    <div class="section s1"><h2>Body measurements</h2><div class="grid" id="box-body"></div></div>
    <div class="section s2"><h2>Blood tests</h2><div class="grid" id="box-blood"></div></div>
    <div class="section s3"><h2>Lifestyle</h2><div class="grid" id="box-life"></div></div>
    <div class="section s4"><h2>Medical history</h2><div class="grid" id="box-hist"></div></div>

    <p id="err" role="alert"></p>
    <div class="actions">
      <button type="submit" id="go">Classify</button>
      <button type="button" id="reset">Clear form</button>
    </div>
  </form>

  <section id="out" aria-live="polite"></section>
  <p class="foot">Educational demo only. Not medical advice.</p>
</main>

<script>
/* ============================================================
   MODEL (logistic regression trained on heart_disease.csv)
   z = BIAS + sum( w * (x - mean) / sd )     probability = 1 / (1 + e^-z)
   type: num = number, ord = Low/Medium/High (0/1/2), bin = 1 if answer equals "pos"
   ============================================================ */
const BIAS = -0.00283;
const FEATURES = [
  {"name": "Age", "type": "num", "unit": "years", "min": 18, "max": 80, "mean": 49.2954, "sd": 18.16757, "w": -0.02296},
  {"name": "Blood Pressure", "type": "num", "unit": "mmHg", "min": 120, "max": 180, "mean": 149.7582, "sd": 17.55627, "w": -0.03577},
  {"name": "Cholesterol Level", "type": "num", "unit": "mg/dL", "min": 150, "max": 300, "mean": 225.4273, "sd": 43.5104, "w": 0.00496},
  {"name": "BMI", "type": "num", "unit": "kg/m²", "min": 18, "max": 40, "mean": 29.07727, "sd": 6.30016, "w": 0.04865},
  {"name": "Sleep Hours", "type": "num", "unit": "hours/night", "min": 4, "max": 10, "mean": 6.99136, "sd": 1.751, "w": -0.01},
  {"name": "Triglyceride Level", "type": "num", "unit": "mg/dL", "min": 100, "max": 400, "mean": 250.7325, "sd": 86.95396, "w": 0.00669},
  {"name": "Fasting Blood Sugar", "type": "num", "unit": "mg/dL", "min": 80, "max": 160, "mean": 120.1419, "sd": 23.55805, "w": -0.00717},
  {"name": "CRP Level", "type": "num", "unit": "mg/L", "min": 0, "max": 15, "mean": 7.4722, "sd": 4.3346, "w": -0.01529},
  {"name": "Homocysteine Level", "type": "num", "unit": "µmol/L", "min": 5, "max": 20, "mean": 12.45618, "sd": 4.3191, "w": 0.02038},
  {"name": "Gender", "type": "bin", "pos": "Male", "mean": 0.5022, "sd": 0.50002, "w": -0.04355},
  {"name": "Exercise Habits", "type": "ord", "mean": 1.0126, "sd": 0.81652, "w": 0.0043},
  {"name": "Smoking", "type": "bin", "pos": "Yes", "mean": 0.5148, "sd": 0.49981, "w": 0.00635},
  {"name": "Family Heart Disease", "type": "bin", "pos": "Yes", "mean": 0.4975, "sd": 0.50002, "w": -0.02018},
  {"name": "Diabetes", "type": "bin", "pos": "Yes", "mean": 0.4952, "sd": 0.5, "w": -0.00587},
  {"name": "High Blood Pressure", "type": "bin", "pos": "Yes", "mean": 0.5048, "sd": 0.5, "w": 0.00684},
  {"name": "Low HDL Cholesterol", "type": "bin", "pos": "Yes", "mean": 0.5025, "sd": 0.50002, "w": -0.0147},
  {"name": "High LDL Cholesterol", "type": "bin", "pos": "Yes", "mean": 0.4938, "sd": 0.49999, "w": 0.02077},
  {"name": "Alcohol Consumption", "type": "ord", "mean": 0.9938, "sd": 0.70101, "w": 0.0124},
  {"name": "Stress Level", "type": "ord", "mean": 0.9951, "sd": 0.81188, "w": 0.03134},
  {"name": "Sugar Consumption", "type": "ord", "mean": 0.991, "sd": 0.82158, "w": 0.01755}
];

/* Which section each input goes in */
const SECTION = {
  "Age":"body","Gender":"body","BMI":"body","Blood Pressure":"body",
  "Cholesterol Level":"blood","Triglyceride Level":"blood","Fasting Blood Sugar":"blood","CRP Level":"blood","Homocysteine Level":"blood","Low HDL Cholesterol":"blood","High LDL Cholesterol":"blood",
  "Exercise Habits":"life","Smoking":"life","Alcohol Consumption":"life","Stress Level":"life","Sleep Hours":"life","Sugar Consumption":"life",
  "Family Heart Disease":"hist","Diabetes":"hist","High Blood Pressure":"hist"
};

/* ---------- build the form ---------- */
FEATURES.forEach((f, i) => {
  const wrap = document.createElement("div");
  if (f.type === "num") {
    const step = (f.max - f.min) > 100 ? 1 : 0.1;
    wrap.innerHTML = `<label class="t" for="f${i}">${f.name} <small>(${f.unit})</small></label>
      <input id="f${i}" type="number" step="${step}" min="${f.min}" max="${f.max}" placeholder="${f.min} to ${f.max}">`;
  } else {
    const options = f.type === "ord" ? ["Low","Medium","High"] : (f.pos === "Male" ? ["Male","Female"] : ["Yes","No"]);
    wrap.innerHTML = `<label class="t">${f.name}</label><div class="pills" id="g${i}" role="radiogroup" aria-label="${f.name}">` +
      options.map(o => `<label class="${o}"><input type="radio" name="f${i}" value="${o}"><span>${o}</span></label>`).join("") + `</div>`;
  }
  document.getElementById("box-" + SECTION[f.name]).appendChild(wrap);
});

/* ---------- classify ---------- */
document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  let z = BIAS; const missing = [];
  FEATURES.forEach((f, i) => {
    let raw;
    if (f.type === "num") {
      const el = document.getElementById("f" + i);
      raw = el.value;
      const bad = raw === "" || isNaN(+raw);
      el.toggleAttribute("aria-invalid", bad);
    } else {
      const picked = document.querySelector(`input[name=f${i}]:checked`);
      raw = picked ? picked.value : "";
      document.getElementById("g" + i).classList.toggle("group-invalid", !picked);
    }
    if (raw === "" || (f.type === "num" && isNaN(+raw))) { missing.push(f.name); return; }
    const x = f.type === "num" ? +raw : f.type === "ord" ? ["Low","Medium","High"].indexOf(raw) : (raw === f.pos ? 1 : 0);
    z += f.w * (x - f.mean) / f.sd;
  });

  const err = document.getElementById("err"), out = document.getElementById("out");
  if (missing.length) { err.textContent = "Please fill in: " + missing.join(", ") + "."; out.style.display = "none"; return; }
  err.textContent = "";

  const p = 1 / (1 + Math.exp(-z)), yes = p >= 0.5, pct = (p * 100).toFixed(1);
  out.className = yes ? "yes" : "no";
  out.style.display = "block";
  out.innerHTML = `<h2>${yes ? "⚠️ Prediction: Yes (heart disease)" : "✅ Prediction: No (no heart disease)"}</h2>
    <div class="ring" style="--deg:${p * 360}deg"><div>${pct}%</div></div>
    <div>Probability of heart disease (threshold 50%)</div>
    <p class="small">On held-out rows of the dataset this model scored about chance level (ROC AUC 0.47), so treat the result as a demo of the pipeline, not a reliable prediction.</p>`;
  out.scrollIntoView({behavior: "smooth", block: "nearest"});
});

document.getElementById("reset").onclick = () => {
  document.getElementById("form").reset();
  document.getElementById("out").style.display = "none";
  document.getElementById("err").textContent = "";
  document.querySelectorAll("[aria-invalid]").forEach(el => el.removeAttribute("aria-invalid"));
  document.querySelectorAll(".group-invalid").forEach(el => el.classList.remove("group-invalid"));
};
</script>
</body>
</html>
